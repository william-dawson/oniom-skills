name: Package skills for release

on:
  release:
    types: [published]

jobs:
  attach-skills-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build skills zip
        run: |
          mkdir -p dist
          cp skills/pymol/SKILL.md dist/pymol.md
          cp skills/oniom/SKILL.md dist/oniom.md
          cd dist && zip ../oniom-skills.zip pymol.md oniom.md

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} oniom-skills.zip
